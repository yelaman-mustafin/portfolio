<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef1">
<title>Еламан Мустафин — Digital & Performance Marketing</title>
<meta name="description" content="Портфолио Еламана Мустафина: 8+ лет в digital и performance. Kcell, Bank RBK, nFactorial, агентства; проекты с цифрами, пет-проекты, курсы и навыки.">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== темы: светлая по умолчанию, тёмная по системе или переключателю ===== */
:root{
  --bg:#eceef1;--fg:#1a1c22;--muted:#5b616e;--dim:#868c97;
  --line:#dde0e6;--line2:#c6cad2;--hover:#f7f8fa;--tile:#eff1f4;--card:#fff;--card2:#fff;
  --accent:#2440e0;--hv-def:#2b2d34;--hl:#f4f5f7;--inv-bg:#1a1c22;--inv-fg:#fff;--bar-bg:#eceef1;--shade:rgba(20,22,28,.5);
  --ink-card:#1a1c22;--mark:#ffe45c;
  --sans:"Geist",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bar:60px;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0a0a0c;--fg:#f2f2f3;--muted:#a3a4aa;--dim:#7a7b82;
  --line:#26272c;--line2:#37383e;--hover:#17181c;--tile:#202126;--card:#131417;--card2:#16171b;
  --accent:#8b98ff;--hv-def:#33353d;--hl:#1b1c21;--inv-bg:#fff;--inv-fg:#000;--bar-bg:#0a0a0c;--shade:rgba(0,0,0,.65);
  --ink-card:#1d1d24;--mark:rgba(201,168,0,.45);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0c;--fg:#f2f2f3;--muted:#a3a4aa;--dim:#7a7b82;
  --line:#26272c;--line2:#37383e;--hover:#17181c;--tile:#202126;--card:#131417;--card2:#16171b;
  --accent:#8b98ff;--hv-def:#33353d;--hl:#1b1c21;--inv-bg:#fff;--inv-fg:#000;--bar-bg:#0a0a0c;--shade:rgba(0,0,0,.65);
  --ink-card:#1d1d24;--mark:rgba(201,168,0,.45);color-scheme:dark;
}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:auto;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bar) + 16px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
kbd{font:500 11px/1 var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:3px 5px;background:var(--tile)}
.ph{color:var(--muted);border-bottom:1px dashed var(--dim)}
ul{margin:0}

/* верхняя панель */
.bar{position:sticky;top:0;z-index:10;background:var(--bar-bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1160px;margin:0 auto;height:var(--bar);padding:0 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.brand span{font-weight:600}
.nav{list-style:none;padding:0;display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:6px 10px;border-radius:7px;color:var(--muted);font-size:13px}
.nav a:hover{color:var(--fg);background:var(--hover)}
.nav a.active{color:var(--fg);background:var(--tile)}
.tools-r{display:flex;gap:8px;flex:none}
.search-btn,.theme-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:8px;height:34px;padding:0 8px 0 10px;color:var(--muted);font-size:13px}
.theme-btn{width:34px;padding:0;justify-content:center}
.search-btn:hover,.theme-btn:hover{color:var(--fg);border-color:var(--fg)}
.search-btn span:last-child{display:flex;gap:3px}
.theme-btn .sun{display:none}
/* кнопка-кубик */
.dice-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 9px;border:1px solid var(--line2);border-radius:8px;color:var(--fg);font-size:13px;font-weight:500;background:var(--card)}
.dice-btn:hover{border-color:var(--fg)}
.dice-btn .die{flex:none;transform-origin:50% 50%}
.dice-btn.rolling .die{animation:dieRoll .7s cubic-bezier(.3,.7,.3,1)}
.dice-btn:active .die{transform:scale(.88)}
@keyframes dieRoll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-120deg) scale(1.25) translateY(-2px)}55%{transform:rotate(240deg) scale(.9)}80%{transform:rotate(380deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
.d-acts{display:flex;align-items:center;gap:6px}
.d-close{display:flex;align-items:center;justify-content:center;gap:8px;height:32px;min-height:0;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--fg);font-size:12.5px;font-weight:500}
.d-close:hover{border-color:var(--fg)}
.d-close-t{display:flex;align-items:center;gap:8px}
.d-close-x{display:none}
.drawer:focus{outline:none}
.swipe-hint{display:none}
@media (hover:none),(pointer:coarse){.swipe-hint{display:block;text-align:center;font-size:11.5px;color:var(--dim);padding:6px 0 0}}
/* на телефонах и планшетах Esc нет — только крестик */
@media (hover:none),(pointer:coarse),(max-width:760px){.d-close{width:36px;height:36px;padding:0}.d-close-t{display:none}.d-close-x{display:block}.dice-btn.sm{height:36px}}
.dice-btn.sm{height:32px;padding:0 10px 0 7px;font-size:12.5px}
.confetti{position:fixed;z-index:60;width:8px;height:8px;border-radius:2px;pointer-events:none}
.d-body.reroll{animation:dIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes dIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:760px){.dice-btn:not(.sm) span{display:none}.dice-btn:not(.sm){width:34px;padding:0;justify-content:center}}
@media (max-width:420px){.dice-btn.sm span{display:none}.dice-btn.sm{width:32px;padding:0;justify-content:center}}
@media (prefers-reduced-motion:reduce){.dice-btn.rolling .die,.d-body.reroll{animation:none}}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .sun{display:block}:root:not([data-theme="light"]) .theme-btn .moon{display:none}}

.main{max-width:1160px;margin:0 auto;padding:28px 20px 80px}
.section{margin-bottom:64px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.sec-n{font:400 13px/1 var(--mono);color:var(--dim)}
.sec-h h2{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.03em;margin:0}
.sec-sub{color:var(--muted);margin:-12px 0 22px;max-width:62ch}

/* бенто */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;grid-auto-flow:dense}
.b{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);text-align:left;display:flex;flex-direction:column;min-width:0}
.b.w{grid-column:span 2}
.b.l{grid-column:span 2;grid-row:span 2}
.grid-cards{grid-auto-rows:minmax(150px,auto)}
.b-me{grid-column:span 2;flex-direction:row;align-items:center;gap:16px;background:var(--card2)}
.ava{position:relative;flex:none;width:88px;height:88px}
.ava img{position:absolute;inset:0;transition:opacity .9s ease}
.ava img+img{opacity:0}.ava.swap img+img{opacity:1}
.b-me img{width:88px;height:88px;border-radius:20px;object-fit:cover;border:1px solid var(--line2)}
.who-n{font-size:22px;font-weight:700;letter-spacing:-.02em}
.who-r{color:var(--accent);font-weight:600;font-size:14px}
.b-anim{grid-column:span 2;grid-row:span 2;padding:0;overflow:hidden;min-height:320px;background:var(--card2);position:relative}
.b-anim canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.anim-ui{position:absolute;left:16px;right:12px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.anim-title{font-size:12px;color:var(--dim)}
.anim-dots{display:flex}
.anim-dots button{width:28px;height:28px;display:grid;place-items:center}
.anim-dots button::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--line2);transition:width .25s,background .25s}
.anim-dots button[aria-current="true"]::before{width:18px;background:var(--accent)}
.anim-dots button:not([aria-current="true"]):hover::before{background:var(--muted)}
@media (prefers-reduced-motion:reduce){.anim-dots button::before{transition:none}}
.b-about h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.03em;margin:0 0 10px}
.b-about{grid-column:span 2}
.b-about{justify-content:center;padding:20px}.b-about p{margin:0;font-size:15px;color:var(--muted)}
.b-about p+p{margin-top:10px;color:var(--fg)}
.b-skills{grid-column:span 4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.b-skills b{display:block;font-size:14px;font-weight:600}
.b-skills span{font-size:13px;color:var(--muted)}
.b-links{grid-column:span 4;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center}
.chip-link{display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--line2);border-radius:999px;padding:0 14px;font-size:13px;font-weight:500}
.chip-link:hover{border-color:var(--fg)}
.chip-link.primary{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}

.card-t{font-weight:600;display:block}
.card-d{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* карточки кейсов: одна сетка, одна структура */
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cases.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.b-proj{gap:4px;padding:18px;cursor:pointer;min-height:196px}
.b-proj:hover{border-color:var(--line2);background:var(--hover)}
.b-meta{font-size:12px;color:var(--dim);padding-right:24px}
.b-proj .card-t{padding-right:24px}
.b-proj .card-t{font-size:18px;line-height:1.25;letter-spacing:-.02em}
.b-proj .card-d{-webkit-line-clamp:2;margin-bottom:16px}
.b-open{position:absolute;top:16px;right:18px;color:var(--dim)}
.b-proj:hover .b-open{color:var(--fg)}

/* цифры */
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:12px;color:var(--muted)}
.kv > span{display:flex;flex-direction:column}
.kv b{font-size:22px;line-height:1.15;color:var(--fg);font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.b-proj .kv{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);gap:6px 20px}
.b-proj .kv b{font-size:21px}
.b-proj:not(:has(.kv)):not(:has(.b-chips)){min-height:0}
.b-chips{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.b-chips span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--tile);color:var(--muted)}
.b-proj[class*=" t-"] .b-chips{border-color:rgba(255,255,255,.2)}
.b-proj[class*=" t-"] .b-chips span{background:rgba(255,255,255,.15);color:#fff}

.b-proj{transition:background-color .12s linear,border-color .12s linear,filter .12s linear}
/* наведение: лёгкая подсветка без заливки, сразу и без наклона */
@media (hover:hover){
  .b-proj.hv:hover,.b-proj.hv:focus-visible{background:var(--hl)!important}
  .b-proj .b-open{transition:transform .12s linear,color .12s linear}
  .b-proj:hover .b-open,.b-proj:focus-visible .b-open{transform:translate(2px,-2px)}
}

/* остальные проекты: компактный список */
.more-list{margin-top:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.more-list h3{margin:0;padding:14px 18px 6px;font-size:13px;font-weight:500;color:var(--dim)}
.rows2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;padding:0 18px 6px}
.p-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.p-row:hover .p-row-t{color:var(--accent)}
.p-row-t{font-weight:600}
.p-wrap{display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid var(--line)}
.p-wrap .p-row{border-bottom:0;flex:1;min-width:0}
.p-ext{flex:none;display:grid;place-items:center;width:34px;height:34px;margin-top:8px;border:1px solid var(--line2);border-radius:9px;color:var(--muted)}
.p-ext:hover{color:var(--accent);border-color:var(--accent)}
.rows2.flat .p-wrap{border-bottom:0}
.rows2.flat{padding:0}
.rows2{align-items:start}.p-row{align-content:start}
.rows2.flat{padding-top:6px}.rows2.flat .p-row{border-bottom:0;padding:10px 0}
.rows2.flat .p-row-d{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fold-body .rows2.flat{border-top:1px solid var(--line)}
.p-row-m:empty{display:none}
.p-row-m{font-size:12px;color:var(--dim);white-space:nowrap}
.p-row-d{grid-column:1/-1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* цветные карточки брендов — светлый текст в обеих темах */
.t-kcell{--tone:#5d3081}.t-kcellactiv{--tone:linear-gradient(125deg,#5d3081 0%,#5d3081 25%,#8a3577 60%,#d93e5e 100%)}.t-green{--tone:#00573f}.t-toyota{--tone:#d40a1b}.t-yo{--tone:#e1291f}.t-green2{--tone:#14674a}.t-absolut{--tone:#1d3bd1}.t-jd{--tone:#000}.t-altel{--tone:linear-gradient(135deg,#e04a97 0%,#d74392 50%,#b03478 100%)}.t-tele2altel{--tone:linear-gradient(125deg,#121214 0%,#121214 30%,#5e2346 62%,#d74392 100%)}.t-beat{--tone:#ffd400}.t-activ{--tone:#d93e5e}.t-silver{--tone:linear-gradient(115deg,#f2f4f6 0%,#d3d8de 32%,#f4f5f7 50%,#bcc2ca 70%,#e6e9ec 100%)}.t-pernod{--tone:#1e2e4a}.t-punch{--tone:linear-gradient(125deg,#0d0b0b 0%,#0d0b0b 38%,#5a1513 66%,#d53c37 100%)}.t-alem{--tone:#47a03f}.t-central{--tone:#ae664d}
/* «Мартин и Кимура»: тёмный фон как на обложках + полоса из цветов серий */
.t-martin{--tone:linear-gradient(90deg,#f2ee2b 0 16.66%,#f2662b 0 33.33%,#e040c8 0 50%,#5ee6f2 0 66.66%,#7cf04a 0 83.33%,#fff 0) bottom/100% 5px no-repeat,linear-gradient(160deg,#1b1d24 0%,#101116 60%,#0a0a0d 100%)}
.t-bf{--tone:#e8e6df}.t-fin{--tone:linear-gradient(165deg,#fbfcfe 0%,#eaf0fa 45%,#cfdcf5 100%)}
:is(.b-proj,.d-hero,.bc).t-bf{color:#23262e!important;box-shadow:inset 0 0 0 1px rgba(153,105,83,.3),inset 0 3px 0 #996953}
:is(.b-proj,.d-hero,.bc).t-bf :is(.card-d,.kv,.b-meta,.d-meta,.d-lead,.bc-d,h5){color:rgba(35,38,46,.7)!important}
:is(.b-proj,.d-hero,.bc).t-bf .kv b{color:#996953!important}
:is(.b-proj,.d-hero,.bc).t-bf .b-open{color:#23262e!important}
:is(.b-proj,.d-hero,.bc).t-bf :is(.kv,.b-chips){border-color:rgba(153,105,83,.3)!important}
:is(.b-proj,.bc).t-bf :is(.b-chips span,.bc-tags span){background:rgba(153,105,83,.14)!important;color:#6e4535!important}
.bc.t-bf li::marker{color:#996953}
:is(.b-proj,.d-hero,.bc).t-fin{color:#142874!important;box-shadow:inset 0 0 0 1px rgba(42,70,184,.22),inset 0 3px 0 #2a46b8}
:is(.b-proj,.d-hero,.bc).t-fin :is(.card-d,.kv,.b-meta,.d-meta,.d-lead,.bc-d,h5){color:rgba(20,40,116,.72)!important}
:is(.b-proj,.d-hero,.bc).t-fin .kv b{color:#2a46b8!important}
:is(.b-proj,.d-hero,.bc).t-fin .b-open{color:#142874!important}
:is(.b-proj,.d-hero,.bc).t-fin :is(.kv,.b-chips){border-color:rgba(42,70,184,.22)!important}
:is(.b-proj,.bc).t-fin :is(.b-chips span,.bc-tags span){background:rgba(42,70,184,.1)!important;color:#142874!important}
.bc.t-fin li::marker{color:#2a46b8}
.t-qiwi{--tone:#fdf7f0}
:is(.b-proj,.d-hero).t-qiwi{color:#1d1d1f!important;box-shadow:inset 0 0 0 1px rgba(240,146,53,.35)}
:is(.b-proj,.d-hero).t-qiwi :is(.card-t,h3){color:#ef8f2f!important}
:is(.b-proj,.d-hero).t-qiwi :is(.card-d,.kv,.b-meta,.d-meta,.d-lead){color:rgba(29,29,31,.68)!important}
:is(.b-proj,.d-hero).t-qiwi :is(.kv b,.b-open){color:#ef8f2f!important}
:is(.b-proj,.d-hero).t-qiwi :is(.kv,.b-chips){border-color:rgba(240,146,53,.3)!important}
.b-proj.t-qiwi .b-chips span{background:#fff!important;color:#c86b12!important;box-shadow:inset 0 0 0 1px rgba(240,146,53,.45);border-radius:999px!important}
.b-proj.t-qiwi:hover{box-shadow:inset 0 0 0 1.5px #ef8f2f,0 14px 34px -18px rgba(240,146,53,.6)}
.t-punch .kv b{color:#e5463f!important}
.t-alem .kv b{color:#ffff55!important}
:is(.b-proj,.d-hero).t-martin :is(.card-t,h3),.t-martin .kv b{color:#f2ee2b!important}
:is(.b-proj,.d-hero).t-martin :is(.card-d,.kv,.b-meta,.d-meta,.d-lead){color:rgba(255,255,255,.78)!important}
.b-proj.t-martin .b-chips span{background:rgba(242,238,43,.14)!important;color:#f2ee2b!important}
.b-proj.t-alem .card-d,.d-hero.t-alem .d-lead{color:#fff!important}
/* Central: терракота и кремовый, как в их постах */
:is(.b-proj,.d-hero).t-central{color:#eef1d8!important}
:is(.b-proj,.d-hero).t-central :is(.card-d,.kv,.b-meta,.d-meta,.d-lead){color:rgba(238,241,216,.85)!important}
:is(.b-proj,.d-hero).t-central :is(.kv b,.b-open){color:#eef1d8!important}
:is(.b-proj,.d-hero).t-central :is(.kv,.b-chips){border-color:rgba(238,241,216,.3)!important}
.b-proj.t-central .b-chips span{background:rgba(238,241,216,.18)!important;color:#eef1d8!important}
/* светлые фирменные цвета: тёмный текст */
.bc:is(.t-beat,.t-silver){color:#15161a!important}
.bc:is(.t-beat,.t-silver) :is(.bc-d,.kv,h5){color:rgba(0,0,0,.66)!important}
.bc:is(.t-beat,.t-silver) .kv b{color:#15161a!important}
.bc:is(.t-beat,.t-silver) .bc-tags span{background:rgba(0,0,0,.08)}
.bc:is(.t-beat,.t-silver) li::marker{color:rgba(0,0,0,.45)}
/* карточки с несколькими брендами: цвета сменяются */
.b-proj.multi{overflow:hidden;transition:color .7s ease}
.b-proj.multi > .tl{position:absolute;inset:0;background:var(--tone);opacity:0;transition:opacity .6s ease;pointer-events:none}
.b-proj.multi > .tl.on{opacity:1}
.b-proj.multi:not(.on-brand) > .tl{opacity:0!important}
.b-proj.multi,.b-proj.multi > .tl,.b-proj.multi :is(.card-d,.kv,.b-meta,.kv b,.b-open,.b-chips span){transition-duration:.12s!important;transition-timing-function:linear!important}
.b-proj.multi > :not(.tl):not(.b-open){position:relative;z-index:1}
.b-proj.multi > .b-open{z-index:1}
.b-proj.multi :is(.card-d,.kv,.b-meta,.kv b,.b-open,.b-chips span){transition:color .7s ease,background-color .7s ease,border-color .7s ease}
.b-proj.multi.lite-on{color:#15161a}
.b-proj.multi.lite-on :is(.card-d,.kv,.b-meta){color:rgba(0,0,0,.66)}
.b-proj.multi.lite-on .kv b{background:none!important;-webkit-background-clip:border-box!important;color:#15161a!important}
.b-proj.multi.lite-on .b-open{color:#15161a}
.b-proj.multi.lite-on :is(.kv,.b-chips){border-color:rgba(0,0,0,.15)}
.b-proj.multi.lite-on .b-chips span{background:rgba(0,0,0,.08);color:#15161a}.t-metal{--tone:linear-gradient(115deg,#1d2024 0%,#3d424a 30%,#6a7079 48%,#878d96 52%,#5a6068 62%,#2a2e34 82%,#1a1c20 100%)}.t-rbk{--tone:linear-gradient(120deg,#0a1214 0%,#163236 55%,#2e7177 100%)}.t-has{--tone:linear-gradient(120deg,#4b44c4 0%,#33297e 55%,#221d4f 100%)}.t-menar{--tone:#2563d9}.t-blue{--tone:#2440e0}.t-ink{--tone:var(--ink-card)}
.b-proj[class*=" t-"]{background:var(--tone)!important;border-color:transparent!important;color:#fff}

.b-proj[class*=" t-"] .card-d,.b-proj[class*=" t-"] .kv,.b-proj[class*=" t-"] .b-meta{color:rgba(255,255,255,.78)}
.b-proj[class*=" t-"] .kv b,.b-proj[class*=" t-"] .b-open{color:#fff}
.b-proj[class*=" t-"] .kv{border-color:rgba(255,255,255,.2)}
.b-proj[class*=" t-"] .ph{color:inherit;border-color:rgba(255,255,255,.5)}
.t-metal .kv b{background:linear-gradient(180deg,#fff 20%,#c9ced6 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
/* карточки брендов внутри кейса Pernod Ricard: каждая в своём стиле */
.t-jm{--tone:radial-gradient(120% 90% at 20% 0%,#2c5543 0%,#244637 55%,#1f3d30 100%)}.t-jm2{--tone:radial-gradient(120% 90% at 20% 0%,#336050 0%,#2a5241 60%,#244637 100%)}
.t-abs{--tone:#0a0fb8}
.t-bt{--tone:#111214}
.t-chv{--tone:linear-gradient(135deg,#a8803a,#e2c072 45%,#c9a24e 70%,#a37a34)}
.t-ara{--tone:#f7f3ea}
.t-bal{--tone:#000052}
.t-olm{--tone:#12384a}
.bc.t-jm,.bc.t-jm2{color:#f1e4b8}
.bc:is(.t-jm,.t-jm2) :is(.bc-d,.kv,h5){color:rgba(241,228,184,.78)!important}
.bc:is(.t-jm,.t-jm2) li::marker{color:rgba(241,228,184,.55)!important}
.bc:is(.t-jm,.t-jm2) li{color:#f1e4b8!important}
.bc:is(.t-jm,.t-jm2) .bc-tags span{background:rgba(241,228,184,.14)!important;color:#f1e4b8}
.d-sec .bc:is(.t-jm,.t-jm2) h4{font-family:Georgia,"Times New Roman",serif;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#f1e4b8}
.d-sec .bc.t-jm h4{font-size:28px}
.bc:is(.t-jm,.t-jm2) .kv b{color:#f1e4b8!important}
.d-sec .bc.t-abs h4{font-family:Impact,"Haettenschweiler","Arial Narrow",sans-serif;font-weight:900;font-stretch:condensed;text-transform:uppercase;letter-spacing:-.01em;font-size:26px}
.bc.t-abs h4::after{content:"."}
.d-sec .bc.t-bt h4{color:transparent;-webkit-text-stroke:1.2px #f3c24f;font-weight:900;letter-spacing:.2em;font-size:26px}
.bc.t-bt .kv b{color:#f3c24f!important}
.bc.t-bt li::marker{color:#f3c24f}
.bc.lt{color:#2a1a10}
.bc.lt .bc-d,.bc.lt .kv,.bc.lt h5{color:rgba(42,26,16,.72)!important}
.bc.lt .kv b{color:inherit!important}
.bc.lt :is(li,.bc-l,h4 ~ *){color:#2a1a10!important}
.bc.lt .bc-tags span{background:rgba(42,26,16,.08)!important}
.bc.lt li::marker{color:rgba(42,26,16,.45)!important}
.bc.lt .ph{border-color:rgba(42,26,16,.35)!important}
.d-sec .bc.t-chv h4{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.06em;color:#5a0f1c}
.bc.t-chv h4::after{content:" Regal"}
.bc.t-ara{box-shadow:inset 0 0 0 1px rgba(184,150,63,.35)}
.d-sec .bc.t-ara h4{font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:#b08a33}
.d-sec .bc.t-bal h4{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:25px}
.d-sec .bc.t-olm h4{text-transform:uppercase;font-weight:900;letter-spacing:.04em;color:#f6e85c}
.bc.t-olm .kv b{color:#5fe3ea!important}

/* мини-блоки брендов внутри карточки (Pernod Ricard) */
.b-logos{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.b-logos .lg{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:7px;font-size:11.5px;line-height:1;white-space:nowrap}
.lg-jameson{background:#254a3a;color:#f1e4b8;font-family:Georgia,"Times New Roman",serif;font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px!important}
.lg-absolut{background:#0a0fb8;color:#fff;font-family:Impact,"Haettenschweiler","Arial Narrow",sans-serif;font-weight:900;font-stretch:condensed;font-size:14px!important;letter-spacing:-.01em}
.lg-beat{background:#111214;color:transparent;-webkit-text-stroke:1px #f3c24f;font-weight:900;font-size:14px!important;letter-spacing:.2em;padding-right:7px!important}
.lg-chivas{background:linear-gradient(135deg,#a8803a,#e7c67a 50%,#b48b40);color:#5a0f1c;font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.06em}
.lg-ararat{background:#f7f3ea;color:#b08a33;font-weight:600;letter-spacing:.14em;box-shadow:inset 0 0 0 1px rgba(184,150,63,.4)}
.lg-ballantines{background:#000052;color:#fff;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px}
.b-logos .lg-more{background:none;padding:0 2px;color:inherit;opacity:.55;font-size:13px}
.lg-olmeca{background:#12384a;color:#f6e85c;font-weight:900;letter-spacing:.04em}

/* карточки проектов без обводок: ни рамки, ни цветной полоски, ни контура */
.b-proj,.b-proj:hover,.b-proj:focus-visible,.fold-body .b-proj:hover{border-color:transparent!important;box-shadow:none!important}
.acc-card .kv b,.d-hero.acc .kv b{color:var(--acc)}
.t-rbk .kv b{color:#7fe3df!important}.t-has .kv b{color:#ffe14d!important}
@media (max-width:900px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.cases,.cases.c2,.rows2{grid-template-columns:1fr}.b-proj{min-height:0}}

/* фильтры */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;border:1px solid var(--line2);border-radius:999px;min-height:36px;padding:0 14px;font-size:13px;color:var(--muted)}
.filters button:hover{color:var(--fg);border-color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.filters small{opacity:.55;margin-left:5px;font-family:var(--mono)}

/* анимации при прокрутке (только если JS работает и движение не отключено) */
.scroll-bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
@media (prefers-reduced-motion:no-preference){
  html.anim .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
  html.anim .rv.in{opacity:1;transform:none}
  /* задержка появления касается только opacity/transform, подсветка срабатывает сразу */
  html.anim .b-proj.rv{transition:opacity .6s ease var(--d,0s),transform .6s cubic-bezier(.2,.7,.2,1) var(--d,0s),background-color .12s linear 0s,border-color .12s linear 0s,filter .12s linear 0s}
}

/* свёрнутые блоки */
.fold-sec{margin-bottom:10px}
.fold-sec.last{margin-bottom:64px}
.fold{border:1px solid var(--line);border-radius:16px;background:var(--card)}
.fold summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:baseline;column-gap:10px;row-gap:2px;padding:16px 20px;border-radius:16px}
.fold summary .sec-n{grid-row:1}
.fold summary::-webkit-details-marker{display:none}
.fold summary:hover h2{color:var(--accent)}
.fold summary h2{grid-column:2;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.025em;margin:0}
.fold-sum{grid-column:2;color:var(--muted);font-size:13px;line-height:1.45}
.toggle{grid-column:3;grid-row:1 / span 2;align-self:center;font-size:14px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
.toggle svg{transition:transform .2s}
.fold[open] .toggle svg{transform:rotate(180deg)}
.fold[open] .toggle .show,.fold:not([open]) .toggle .hide{display:none}
.fold-body{padding:0 20px 20px}
.fold-body .jobs{border-top:1px solid var(--line)}
.fold-body .job:last-child{border-bottom:0;padding-bottom:4px}
.fold-body .panel{background:var(--bg)}
.fold-body .b-proj:not([class*=" t-"]){background:var(--bg)}
.fold-body .b-proj:not([class*=" t-"]):hover{border-color:var(--line2)}
@media (max-width:760px){.fold summary{padding:14px 16px;grid-template-columns:24px minmax(0,1fr) auto}.fold summary h2{font-size:20px}.fold-body{padding:0 16px 16px}.toggle .show,.toggle .hide{display:none!important}}
@media (prefers-reduced-motion:reduce){.toggle svg{transition:none}}

/* опыт */
.jobs{border-top:1px solid var(--line2)}
.job{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--line2)}
.job-p{font:400 13px/1.5 var(--mono);color:var(--dim);padding-top:4px}
.job h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.job-r{color:var(--muted);margin-top:2px}
.job-d{margin:10px 0 0;color:var(--muted);max-width:64ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card2);min-width:120px}
.stat-v{font-size:22px;line-height:1.1;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.stat-t{color:var(--muted);font-size:12px;margin-top:2px}
.job-hl{margin-top:14px;padding-left:18px;max-width:70ch}
.job-hl li{margin-bottom:4px}
.job-hl li::marker,.d-sec li::marker,.b-did li::marker,.sub-body li::marker{color:var(--dim)}
.job-pr{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;align-items:center}
.job-pr button{border:1px solid var(--line2);border-radius:8px;min-height:32px;padding:0 10px;font-size:13px;background:var(--card)}
.job-pr-l{color:var(--dim);font-size:13px;margin-right:2px}
.job-pr button:hover{border-color:var(--fg)}

/* курсы, навыки, контакты */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.panel h3{font-size:13px;font-weight:500;color:var(--dim);margin:0;padding:14px 16px 4px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.c-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;padding:0 16px}
.panel > .c-row{margin:0 16px}
.c-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.panel > .c-row:last-child{border-bottom:0}
.c-main{min-width:0}
.c-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.cert{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.cert:hover{text-decoration:underline}
button.cert{padding:0;background:none;border:0;cursor:zoom-in;font-family:inherit}
.lb{padding:0;border:0;background:transparent;max-width:min(980px,94vw);max-height:92vh;overflow:visible}
.lb::backdrop{background:rgba(10,10,14,.75)}
.lb[open]{display:flex;flex-direction:column;align-items:center;gap:10px;animation:lbIn .25s cubic-bezier(.2,.8,.2,1)}
.lb img{display:block;max-width:100%;max-height:80vh;border-radius:12px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);background:#fff}
.lb-cap{margin:0;color:#fff;font-size:14px;text-align:center}
.lb-x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@keyframes lbIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (max-width:560px){.lb-x{top:-48px;right:0}}
@media (prefers-reduced-motion:reduce){.lb[open]{animation:none}}
.c-grid .c-row:last-child,.rows2 .p-wrap:last-child{border-bottom:0}
@media (max-width:760px){.c-grid{grid-template-columns:1fr}}
.row-p{font:400 12px/20px var(--mono);color:var(--dim);flex:none}
.ext{border-bottom:1px solid var(--line2)}
.ext:hover{border-color:var(--fg)}
.skill{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted);background:var(--card)}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.contacts .b{flex-direction:row;gap:12px;align-items:center}
.contacts .b:hover{border-color:var(--line2);background:var(--hover)}
.foot{border-top:1px solid var(--line2);padding-top:20px;color:var(--dim);font-size:12px}

/* панель проекта */
.overlay{position:fixed;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line2);z-index:30;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.d-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.d-crumb{font-size:13px;color:var(--dim)}
.d-crumb button:hover{color:var(--fg)}


.d-body{overflow-y:auto;padding:24px 20px 32px;flex:1;overscroll-behavior:contain}
.d-title{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.d-title .tile{width:44px;height:44px;border-radius:11px;font-size:15px}
.d-title.toned .tile{background:var(--tone);color:#fff;border-color:transparent}
.d-title h3{font-size:24px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.025em}
.d-lead{color:var(--muted);font-size:15px;margin:0 0 20px}
.d-img{display:block;width:100%;aspect-ratio:5/2;object-fit:cover;border-radius:12px;margin:0 0 20px;background:var(--tile)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line2);border-radius:10px;margin:0 0 28px;overflow:hidden;background:var(--card)}
.facts:empty{display:none}
.fact{padding:10px 12px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact dt{font-size:12px;color:var(--dim)}
.fact dd{margin:2px 0 0;font-size:14px;font-weight:600}
.d-sec{margin-bottom:24px}
.brands{display:flex;flex-direction:column;gap:10px}
.bc{border-radius:16px;padding:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.bc[class*=" t-"]{background:var(--tone);color:#fff;border-color:transparent}
.d-sec .bc h4{margin:0 0 4px;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.025em;text-transform:none;color:inherit}
.d-sec .bc.sm h4{font-size:17px}
.bc-d{margin:0;color:var(--muted)}
.bc .kv{margin:12px 0 2px}
.bc .kv b{font-size:24px}
.bc-l{margin:10px 0 0;padding-left:18px;font-size:14px}
.bc-l li{margin-bottom:4px}
.bc h5{margin:12px 0 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.bc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.bc-tags span{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--tile)}
.bc .d-img{margin:-18px -18px 14px;width:calc(100% + 36px);max-width:none;border-radius:0}
.bc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bc[class*=" t-"] .bc-d,.bc[class*=" t-"] .kv,.bc[class*=" t-"] h5{color:rgba(255,255,255,.78)}
.bc[class*=" t-"] .kv b{color:#fff}
.bc[class*=" t-"] .bc-tags span{background:rgba(255,255,255,.15)}
.bc[class*=" t-"] li::marker{color:rgba(255,255,255,.6)}
.bc[class*=" t-"] .ph{color:inherit;border-color:rgba(255,255,255,.5)}
@media (max-width:520px){.bc-grid{grid-template-columns:1fr}}
.verdict{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--v)}
.verdict p{margin:0}
.v-badge,.v-mini{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--v)}
.v-badge::before,.v-mini::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--v)}
.v-mini{margin-left:8px;padding:1px 8px;border-radius:999px;background:#fff;font-size:11px;vertical-align:1px}
.v-unsure{--v:#7a7f8a}.v-success{--v:#1f9d55}.v-ok{--v:#d48a00}.v-fail{--v:#d63a2f}
/* 3D-карусель туров */
.ring{margin:0 -20px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ring-stage{position:relative;height:clamp(300px,58vw,360px);overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ring-stage.dragging{cursor:grabbing}
.rc{position:absolute;left:50%;top:50%;width:var(--rw);height:calc(var(--rw) * 1.25);margin-left:calc(var(--rw) / -2);margin-top:calc(var(--rw) * -.625);
  background:var(--c);color:#fff;border-radius:6px;padding:calc(var(--rw) * .08);display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  container-type:inline-size;will-change:transform,filter,opacity;backface-visibility:hidden}
.rc .rt{display:flex;flex-wrap:wrap;gap:5px}
.rc .rt span{font-size:max(10px,5cqw);line-height:1;padding:.5em .75em;border:1px solid rgba(255,255,255,.5);border-radius:999px}
.rc .rn{margin:0;font-weight:800;font-size:15cqw;line-height:.95;letter-spacing:-.035em;word-break:break-word}
.rc.lite{color:#15161a}.rc.lite .rt span{border-color:rgba(0,0,0,.35)}
/* афиша тура: картинка на всю карточку, текст поверх градиента */
.rc{overflow:hidden}
.rc .rc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}
.rc.has-img{color:#fff}
.rc.has-img::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,transparent 28%,transparent 55%,rgba(0,0,0,.75) 100%)}
.rc.has-img .rt span{border-color:rgba(255,255,255,.6);background:rgba(0,0,0,.25)}
.rc.has-img .rn{font-size:11cqw}
.rc .rt,.rc .rn{position:relative;z-index:1}
.ring-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 20px 16px}
.ring-info{min-width:0;transition:opacity .25s ease,filter .25s ease}
.ring-info.out{opacity:0;filter:blur(6px)}
.ring-info b{display:block;font-size:22px;line-height:1.15;letter-spacing:-.025em}
.ring-info span{color:var(--muted);font-size:13.5px}
.ring-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.ring-count{font:600 15px/1 var(--mono);font-variant-numeric:tabular-nums}
.ring-ctl{display:flex;gap:6px}
.ring-ctl button{width:38px;height:38px;border:1px solid var(--line2);border-radius:50%;font-size:16px}
.ring-ctl button:hover{border-color:var(--fg)}
.d-sec h4{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.d-hero{margin:-24px -20px 22px;padding:26px 20px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.d-hero[class*=" t-"]{background:var(--tone);color:#fff;border-bottom-color:transparent}
.d-hero.acc{box-shadow:inset 0 4px 0 var(--acc)}
.d-meta{margin:0 0 4px;font-size:12px;color:var(--dim)}
.d-hero h3{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.03em;margin:0}
.d-hero .d-lead{margin:8px 0 0;font-size:15px}
.d-hero .kv{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);gap:8px 24px}
.d-hero .kv b{font-size:26px}
.d-hero[class*=" t-"] .d-meta,.d-hero[class*=" t-"] .d-lead,.d-hero[class*=" t-"] .kv{color:rgba(255,255,255,.8)}
.d-hero[class*=" t-"] .kv{border-color:rgba(255,255,255,.22)}
.d-hero[class*=" t-"] .kv b{color:#fff}
.d-hero[class*=" t-"] .ph{color:inherit;border-color:rgba(255,255,255,.5)}
.facts dd{font-size:15px}
.d-sec li::marker{color:var(--accent)}
.sub-body .kv{padding:10px 0 2px}
.d-sec p{margin:0;max-width:64ch}
.d-sec ul{padding-left:18px}
.d-sec li{margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.subs{display:flex;flex-direction:column;gap:8px}
.sub{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sub[open]{border-color:var(--line2)}
.sub summary{list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer}
.sub summary::-webkit-details-marker{display:none}
.sub-t{display:block;font-weight:600}
.sub-d{display:block;color:var(--muted);font-size:13px}
.sub-i{color:var(--dim);font-size:18px;line-height:1;transition:transform .2s}
.sub[open] .sub-i{transform:rotate(45deg);color:var(--fg)}
.sub-body{padding:0 14px 14px}
.sub-body .d-img{margin:4px 0 12px}
.sub-body .kv{margin:4px 0 8px}
.sub-body h5{font-size:12px;font-weight:500;color:var(--dim);margin:12px 0 6px}
.sub-body ul{padding-left:18px}
.sub-body li{margin-bottom:4px}
.d-note{font-size:12.5px;color:var(--dim);margin:8px 0 0}
.d-nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--card)}
.d-nav button{padding:14px 20px;text-align:left;color:var(--muted);font-size:13px}
.d-nav button:last-child{text-align:right;border-left:1px solid var(--line)}
.d-nav button:hover:not(:disabled){color:var(--fg);background:var(--hover)}
.d-nav button:disabled{opacity:.3;cursor:default}
.d-nav small{display:block;color:var(--dim);font-size:11px}

/* поиск */
.cmd{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:var(--shade)}
.cmd.open{display:flex}
.cmd-box{width:min(560px,100%);background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.cmd input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:400 16px var(--sans);color:var(--fg);outline:none}
.cmd ul{list-style:none;padding:6px;max-height:50vh;overflow-y:auto}
.cmd li button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:7px}
.cmd li button[aria-selected="true"]{background:var(--tile)}
.cmd li small{color:var(--dim);font-size:12px;flex:none}
.cmd-empty{padding:16px;color:var(--muted)}

@media (max-width:1000px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .b-links,.b-skills{grid-column:span 2}.b-anim{grid-row:auto;min-height:320px}
  .b-me{order:0}.b-about{order:1}.b-anim{order:2}.b-skills{order:3}.b-links{order:4}
  .b-skills{grid-template-columns:1fr 1fr}
  .contacts{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  :root{--bar:100px}
  .bar-in{height:auto;flex-wrap:wrap;padding:10px 14px 0;gap:10px 12px}
  .brand{margin-right:auto}
  .search-btn span:last-child{display:none}
  .nav{order:3;flex-basis:100%;padding-bottom:8px}
  .main{padding:20px 14px 60px}
  .b-about h1{font-size:23px}
  .b-me{min-height:0;align-items:center}
  .b-me img,.ava{width:68px;height:68px;border-radius:16px}
  .job{grid-template-columns:1fr;gap:6px}
  .two{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .fact:nth-child(2n){border-right:0}
  .fact{border-bottom:1px solid var(--line)}
  .b.l .kv b{font-size:24px}
}
@media (max-width:520px){
  .b-me,.b-anim,.b-about,.b-links,.b-skills,.b.w,.b.l{grid-column:span 2}
  .b-skills{grid-template-columns:1fr}
  .b.l{grid-row:auto}
  .contacts{grid-template-columns:1fr}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drawer,.overlay,.sub-i{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="scroll-bar" id="scrollBar"></div>
  <div class="bar-in">
    <a class="brand" href="#top"><img id="brandAva" alt=""><span id="brandName"></span></a>
    <ul class="nav" id="nav"></ul>
    <div class="tools-r">
      <button class="dice-btn" id="diceBtn" type="button" aria-label="Случайный кейс" title="Случайный кейс"><svg class="die" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><g class="pips" fill="currentColor"><circle cx="8" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="16" cy="16" r="1.6"/></g></svg><span>Случайный кейс</span></button>
      <button class="theme-btn" id="themeBtn" aria-label="Сменить тему">
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="main" id="top">
  <section class="section" style="margin-bottom:10px"><div class="bento" id="hero"></div></section>
  <section class="section fold-sec" id="experience"></section>
  <section class="section fold-sec" id="courses"></section>
  <section class="section fold-sec" id="skills"></section>
  <section class="section fold-sec last" id="pets"></section>
  <section class="section" id="portfolio"></section>
  <section class="section" id="contacts"></section>
  <div class="foot" id="foot"></div>
</main>

<div class="overlay" id="overlay"></div>
<dialog class="lb" id="lb" aria-label="Сертификат"><button type="button" class="lb-x" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img alt=""><p class="lb-cap"></p></dialog>
<aside class="drawer" id="drawer" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="d-bar">
    <div class="d-crumb" id="dCrumb"></div>
    <div class="d-acts"><button class="dice-btn sm" id="dDice" type="button" aria-label="Другой случайный кейс" title="Другой случайный кейс"><svg class="die" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><g class="pips" fill="currentColor"><circle cx="8" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="16" cy="16" r="1.6"/></g></svg><span>Другой кейс</span></button>
    <button class="d-close" id="dClose" type="button" aria-label="Закрыть"><span class="d-close-t">Закрыть <kbd>Esc</kbd></span><svg class="d-close-x" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <div class="d-body" id="dBody"></div>
  <p class="swipe-hint">Смахни влево или вправо, чтобы листать кейсы</p>
  <div class="d-nav"><button id="dPrev"></button><button id="dNext"></button></div>
</aside>

/* Анимация на первом экране: пять сцен из одних и тех же частиц,
   каждая перетекает в следующую.
   Воронка → Атрибуция → HADI-цикл → Рост метрик → UTM-разметка */
(function () {
  const cv = document.getElementById("funnel"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = 140, TAU = Math.PI * 2, D = 4.2, TR = 1;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const PH = Array.from({ length: N }, (_, i) => hash(i));

  /* цвета из темы */
  let col = {};
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const readCol = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme === "dark";
    col = { fg: css("--fg"), muted: css("--muted"), line: dark ? css("--dim") : css("--line2"), accent: css("--accent"), bg: css("--card2") };
  };
  readCol();
  new MutationObserver(() => { readCol(); if (still) render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { readCol(); if (still) render(); });

  /* размеры и проекция */
  let W = 0, H = 0, U = 100, cx = 0, cy = 0;
  const cam = { yaw: 0, tilt: .5, shift: 0 }, ptr = { yaw: 0, tilt: 0, ty: 0, tt: 0 };
  function size() {
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = Math.round(W * d); cv.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    U = Math.min(W / 3.3, H / 2.85); cx = W / 2; cy = H * .49;
  }
  function proj(x, y, z, noYaw) {
    x *= U; y *= U; z *= U;
    const yaw = noYaw ? 0 : cam.yaw + ptr.yaw, c = Math.cos(yaw), s = Math.sin(yaw);
    const x1 = x * c - z * s, z1 = x * s + z * c;
    const t = cam.tilt + ptr.tilt, ct = Math.cos(t), st = Math.sin(t);
    const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;
    const f = 1 / (1 + z2 / (U * 5));
    return [cx + cam.shift * U + x1 * f, cy + y2 * f, z2];
  }
  const depth = (z, lo, hi) => lo + (hi - lo) * clamp(.5 - z / (U * 2));
  function line(a, b, al) { ctx.globalAlpha = al; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  function text(s, x, y, o = {}) {
    ctx.globalAlpha = o.a ?? 1; ctx.fillStyle = o.c || col.muted;
    ctx.font = `${o.w || 500} ${o.s || (W < 460 ? 11 : 12)}px ${o.mono ? "'Geist Mono', ui-monospace, monospace" : "Geist, system-ui, sans-serif"}`;
    ctx.textAlign = o.al || "left"; ctx.textBaseline = o.bl || "middle"; ctx.fillText(s, x, y);
  }
  function dot(x, y, r, c, a) { ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

  /* ---------- 1. Воронка ---------- */
  const STG = [["Показы", 0], ["Клики", .3], ["Лиды", .58], ["Продажи", .84]];
  const NECK = .9, rad = t => t < NECK ? .12 + .88 * Math.pow(1 - t / NECK, 1.35) : .12;
  const born = () => { const r = Math.random(); return { t: 0, th: Math.random() * TAU, f: .25 + Math.random() * .7, v: .1 + Math.random() * .07, die: r < .4 ? .3 : r < .7 ? .58 : r < .88 ? .84 : 9, a: 1 }; };
  const FS = Array.from({ length: N }, () => { const p = born(); p.t = Math.random() * Math.min(p.die, 1.05); return p; });
  const funnelY = t => (t - .5) * 1.7;
  const funnel = {
    name: "Воронка", cam: τ => ({ yaw: τ * .3, tilt: .5, shift: -.3 }),
    update(dt) {
      for (const p of FS) {
        p.th += (.5 + 2.4 * p.t) * dt; p.t += p.v * 1.5 * dt * (p.t > NECK ? 1.6 : 1);
        if (p.t >= p.die) p.a -= 3 * dt;
        if (p.a <= 0 || p.t > 1.12) Object.assign(p, born()); else if (p.t < p.die) p.a = Math.min(1, p.a + 3 * dt);
      }
    },
    pos(i) {
      const p = FS[i], k = p.t > NECK ? 1 : p.f, r = rad(Math.min(p.t, 1.1)) * k, conv = p.die > 1 && p.t > .58;

    },
    back(A) {

        for (let j = 1; j <= 64; j++) { const a = j / 64 * TAU, cu = proj(Math.cos(a) * rad(t), funnelY(t), Math.sin(a) * rad(t)); line(pr, cu, A * depth((pr[2] + cu[2]) / 2, .18, .85)); pr = cu; }
      }

        const a = m / 16 * TAU; let pr = proj(Math.cos(a) * rad(0), funnelY(0), Math.sin(a) * rad(0));
        for (let k = 1; k <= 22; k++) { const t = k / 22 * 1.08, cu = proj(Math.cos(a) * rad(t), funnelY(t), Math.sin(a) * rad(t)); line(pr, cu, A * depth(cu[2], .1, .5)); pr = cu; }
      }
    },
    front(A) {
      const lx = proj(1.3, 0, 0, true)[0];
      STG.forEach(([n, t], i) => {
        const e = proj(rad(t), funnelY(t), 0, true);
        ctx.strokeStyle = col.line; ctx.setLineDash([2, 3]); line([e[0] + 6, e[1]], [lx - 6, e[1]], A * .9); ctx.setLineDash([]);

  /* ---------- 2. Атрибуция ---------- */
  const CH = [["Meta", 32], ["Google", 28], ["TikTok", 16], ["Яндекс", 14], ["CRM", 10]];
  const chOf = (() => { const out = [], cum = []; let s = 0; CH.forEach(c => { s += c[1]; cum.push(s); }); for (let i = 0; i < N; i++) { const u = PH[i] * 100; out.push(cum.findIndex(c => u < c)); } return out; })();
  const node = (j, τ) => { const a = j / CH.length * TAU + τ * .18 - Math.PI / 2; const R = W < 460 ? .98 : 1.2; return [Math.cos(a) * R, 0, Math.sin(a) * R]; };
  const attr = {
    name: "Атрибуция", cam: () => ({ yaw: 0, tilt: .5, shift: 0 }),
    pos(i, τ) {
      const j = chOf[i], P = node(j, τ), u = (τ * .45 + PH[(i * 7) % N] + i * .013) % 1, e = u * u * (3 - 2 * u);
      return [lerp(P[0], 0, e), -.45 * Math.sin(Math.PI * e), lerp(P[2], 0, e), u > .8 ? 1 : 0, 1.4 + 1.2 * u, clamp(u * 6) * clamp((1 - u) * 12)];
    },
    back(A, τ) {
      ctx.strokeStyle = col.line; ctx.lineWidth = 1;
      [[1, 0, 0], [0, 1, 0], [0, 0, 1]].forEach(ax => {
        let pr = null;
        for (let k = 0; k <= 48; k++) {
          const a = k / 48 * TAU, c = Math.cos(a) * .3, s = Math.sin(a) * .3;
          const p = ax[0] ? proj(0, c, s) : ax[1] ? proj(c, 0, s) : proj(c, s, 0);
          if (pr) line(pr, p, A * depth(p[2], .25, .8)); pr = p;
        }
      });
      CH.forEach((_, j) => {
        const P = node(j, τ); let pr = proj(...P);
        for (let k = 1; k <= 16; k++) { const e = k / 16, cu = proj(lerp(P[0], 0, e), -.45 * Math.sin(Math.PI * e), lerp(P[2], 0, e)); ctx.setLineDash([2, 4]); line(pr, cu, A * .5); pr = cu; }
        ctx.setLineDash([]);
      });
    },
    front(A, τ) {
      CH.forEach(([n, w], j) => {
        const q = proj(...node(j, τ)), r = 5;
        dot(q[0], q[1], r + 4, col.bg, A); ctx.strokeStyle = col.fg; ctx.lineWidth = 1.5; ctx.globalAlpha = A * depth(q[2], .5, 1); ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, TAU); ctx.stroke(); ctx.lineWidth = 1;
        const right = q[0] >= cx;
        text(n, q[0] + (right ? r + 8 : -r - 8), q[1], { a: A * depth(q[2], .55, 1), c: col.fg, w: 600, al: right ? "left" : "right" });
      });
      const o = proj(0, .3, 0, true); text("Продажа", o[0], o[1] + 14, { a: A, c: col.accent, w: 600, al: "center" });
    }
  };

  /* ---------- 3. HADI-цикл ---------- */
  const HN = [["Гипотеза", -Math.PI / 2], ["Действие", 0], ["Данные", Math.PI / 2], ["Выводы", Math.PI]];
  const CR = ["+0%", "+12%", "+27%", "+45%", "+68%"], LAP = 2.8, HSTART = .4, HR = .78;
  const head = τ => -Math.PI / 2 + TAU * Math.max(0, τ - HSTART) / LAP;
  const hadi = {
    name: "HADI-цикл", cam: τ => ({ yaw: .22 * Math.sin(τ * .7), tilt: .1, shift: 0 }),
    pos(i, τ) {
      if (i < 96) { const a = i / 96 * TAU; return [Math.cos(a) * HR, Math.sin(a) * HR, 0, 2, 1.3, .7]; }
      const k = i - 96, a = head(τ) - k * .045;
      return [Math.cos(a) * HR, Math.sin(a) * HR, 0, 1, 3 - k * .05, clamp(1 - k / 44) * clamp((τ - HSTART) * 3 + 1)];
    },
    back() {},
    front(A, τ) {
      const h = ((head(τ) % TAU) + TAU) % TAU;
      HN.forEach(([n, a]) => {
        const p = proj(Math.cos(a) * HR, Math.sin(a) * HR, 0), d = Math.abs(((h - ((a + TAU) % TAU) + Math.PI * 3) % TAU) - Math.PI);
        const on = d < .5 && τ > HSTART;
        dot(p[0], p[1], 7, col.bg, A); dot(p[0], p[1], on ? 5.5 : 4, on ? col.accent : col.fg, A);
        const o = proj(Math.cos(a) * (HR + .24), Math.sin(a) * (HR + .2), 0);
        text(n, o[0], o[1], { a: A, c: on ? col.accent : col.fg, w: 600, al: Math.abs(Math.cos(a)) < .1 ? "center" : Math.cos(a) > 0 ? "left" : "right" });
      });
      const lap = clamp(Math.floor(Math.max(0, τ - HSTART) / (LAP / 4)), 0, CR.length - 1), c = proj(0, 0, 0, true), big = Math.round(U * .36);
      text(CR[lap], c[0], c[1] - 4, { a: A, c: col.fg, w: 700, s: big, al: "center" });
      text("рост конверсии", c[0], c[1] + big * .62, { a: A, al: "center" });
    }
  };

  /* ---------- 4. Рост метрик ---------- */
  const GC = 14, GR = 10;
  const gxy = (i, τ) => {
    const c = i % GC, r = Math.floor(i / GC), x = (c / (GC - 1) - .5) * 2.4, z = (r / (GR - 1) - .5) * 1.5;
    const h = .1 + .75 * Math.pow(c / (GC - 1), 1.6) + .12 * Math.sin(x * 2.6 - τ * 2.2 + z * 2);
    return [x, .55 - h * 1.25, z];
  };
  const PEAKS = [[2, 7, "CPL ↓", 30], [7, 2, "CAC ↓", 52], [12, 6, "ROAS ↑", 30]];
  const grow = {
    name: "Рост метрик", cam: τ => ({ yaw: -.5 + .12 * Math.sin(τ * .35), tilt: .55, shift: -.12 }),
    pos(i, τ) { const p = gxy(i, τ), c = i % GC; return [p[0], p[1], p[2], c >= GC - 3 ? 1 : 0, c >= GC - 3 ? 2.2 : 1.6, 1]; },
    back(A, τ) {
      ctx.strokeStyle = col.line;
      for (let i = 0; i < N; i++) {
        const a = proj(...gxy(i, τ));
        if (i % GC < GC - 1) { const b = proj(...gxy(i + 1, τ)); line(a, b, A * depth(a[2], .2, .7)); }
        if (i + GC < N) { const b = proj(...gxy(i + GC, τ)); line(a, b, A * depth(a[2], .12, .45)); }
      }
    },
    front(A, τ) {
      PEAKS.forEach(([c, r, s, up], k) => {
        const p = proj(...gxy(r * GC + c, τ)), on = Math.floor(τ / .9) % 3 === k, y = p[1] - up;
        ctx.strokeStyle = on ? col.accent : col.line; line([p[0], p[1] - 4], [p[0], y + 9], A);
        dot(p[0], p[1], 3.2, on ? col.accent : col.fg, A);
        text(s, p[0], y, { a: A * (on ? 1 : .75), c: on ? col.accent : col.fg, w: 600, al: "center" });
      });
    }
  };

  /* ---------- 5. UTM-разметка ---------- */
  const URL0 = "site.kz/?", PAR = [["utm_source=", "meta"], ["&utm_medium=", "cpc"], ["&utm_campaign=", "promo"]];
  const BX = [-.85, 0, .85], ROWS = [10, 7, 5], CPS = 40, T0 = .5;
  const doneAt = (() => { let n = URL0.length, o = []; PAR.forEach(([a, b]) => { n += a.length + b.length; o.push(T0 + n / CPS); }); return o; })();
  const utm = {
    name: "UTM-разметка", cam: τ => ({ yaw: .2 * Math.sin(τ * .45), tilt: .22, shift: 0 }),
    pos(i, τ) {
      const b = i % 3, k = Math.floor(i / 3), col4 = k % 4, row = Math.floor(k / 4);
      const fill = clamp((τ - doneAt[b]) / .45) * ROWS[b], arr = ease(clamp(fill - row));
      const cloud = [BX[b] + (PH[i] - .5) * .55 + .05 * Math.sin(τ * 1.3 + i), -.5 + (PH[(i * 3) % N] - .5) * .35 + .05 * Math.cos(τ * 1.1 + i), (PH[(i * 5) % N] - .5) * .4];

    },
    front(A, τ) {
      const n = Math.max(0, Math.floor((τ - T0) * CPS)), full = URL0 + PAR.map(p => p[0] + p[1]).join("");
      const typed = full.slice(0, n), fs = W < 460 ? 9.5 : 12.5;
      ctx.font = `500 ${fs}px 'Geist Mono', ui-monospace, monospace`;
      const tw = ctx.measureText(full).width, x0 = cx - tw / 2, y = proj(0, -1.05, 0, true)[1];
      text(typed, x0, y, { a: A, c: col.fg, mono: true, s: fs });
      const caret = x0 + ctx.measureText(typed).width;
      if (Math.floor(τ * 2.4) % 2 === 0 || n < full.length) { ctx.globalAlpha = A; ctx.fillStyle = col.accent; ctx.fillRect(caret + 1, y - fs * .6, 1.5, fs * 1.2); }
      ["source", "medium", "campaign"].forEach((s, b) => {
        const p = proj(BX[b], .9, 0), shown = τ > doneAt[b];
        text(s, p[0], p[1], { a: A, al: "center" });
        text(PAR[b][1], p[0], p[1] + 15, { a: A * (shown ? 1 : .25), c: shown ? col.accent : col.muted, w: 600, al: "center", mono: true });
      });

  /* ---------- движок ---------- */
  const SC = [funnel, attr, hadi, grow, utm];
  let cur = 0, prev = -1, k = 1, t0 = [0, 0, 0, 0, 0], now = 0, hold = false, visible = true, raf = 0, last = 0, since = 0;
  const ui = document.getElementById("animUi"), title = document.getElementById("animTitle");

  function go(i) {
    if (i === cur) return;
    prev = cur; cur = i; k = 0; t0[cur] = now; since = 0; syncUi();
    if (still) { k = 1; prev = -1; now += 4; render(); }

  function render() {
    const τc = now - t0[cur], τp = prev >= 0 ? now - t0[prev] : 0, ek = ease(k);
    const A = SC[cur], B = prev >= 0 ? SC[prev] : null;
    const ca = A.cam(τc), cb = B ? B.cam(τp) : ca;
    cam.yaw = lerp(cb.yaw, ca.yaw, ek); cam.tilt = lerp(cb.tilt, ca.tilt, ek); cam.shift = lerp(cb.shift, ca.shift, ek);

    for (let i = 0; i < N; i++) {

      }
      const q = proj(p[0], p[1], p[2]); pts.push([q, p]);
    }

    for (const [q, p] of pts) dot(q[0], q[1], p[4], C[p[3]], p[5] * depth(q[2], .4, 1));
    if (B) B.front(1 - ek, τp); A.front(ek, τc);

  }

    funnel.update(dt);
    if (k < 1) { k = Math.min(1, k + dt / TR); if (k === 1) prev = -1; }

})();

    ${it.id === "tours" ? `<div class="d-sec"><h4>18 туров</h4><div class="ring" id="ring"><div class="ring-stage" id="ringStage" aria-label="Туры комиков, листай влево и вправо"></div><div class="ring-foot"><div class="ring-info" id="ringInfo"><b id="ringName"></b><span id="ringSub"></span></div><div class="ring-meta"><span class="ring-count" id="ringCount"></span><div class="ring-ctl"><button type="button" id="ringPrev" aria-label="Предыдущий тур">←</button><button type="button" id="ringNext" aria-label="Следующий тур">→</button></div></div></div></div></div>` : it.kind === "brands" && it.subs.length ? `<div class="d-sec"><h4>${subsT}</h4>${brandsHtml(it.subs)}${it.note ? `<p class="d-note">${rich(it.note)}</p>` : ""}</div>` : it.subs.length ? `<div class="d-sec"><h4>${subsT}</h4>
      ${bare.length ? `<div class="tags">${bare.map(x => `<span class="skill">${esc(x.title)}</span>`).join("")}</div>` : ""}
      ${full.length ? `<div class="subs">${full.map((x, i) => `
      <details class="sub"${full.length <= 3 && i === 0 ? " open" : ""}><summary><span><span class="sub-t">${esc(x.title)}</span><span class="sub-d">${rich(x.short)}</span></span><span class="sub-i" aria-hidden="true">+</span></summary>
        <div class="sub-body">
          ${imgHtml(x.img)}
          ${kvHtml(x.kv, "div")}
          ${x.tags.length ? `<div class="tags">${x.tags.map(t => `<span class="skill">${rich(t)}</span>`).join("")}</div>` : ""}
          ${x.did.length ? `<h5>Задачи</h5>${list(x.did)}` : ""}
          ${x.result.length ? `<h5>Результат</h5>${list(x.result)}` : ""}
          ${x.link ? `<p style="margin:12px 0 0"><a class="chip-link" ${linkAttr(x.link)}>${esc(x.link.label)}</a></p>` : ""}
        </div></details>`).join("")}</div>` : ""}
      ${it.note ? `<p class="d-note">${rich(it.note)}</p>` : ""}</div>` : ""}
    ${it.verdict ? `<div class="d-sec"><h4>Моя оценка</h4><div class="verdict v-${it.verdict.mark}"><span class="v-badge">${VERDICT[it.verdict.mark]}</span>${it.verdict.text ? `<p>${rich(it.verdict.text)}</p>` : ""}</div></div>` : ""}
    ${it.task ? `<div class="d-sec"><h4>Задача</h4><p>${rich(it.task)}</p></div>` : ""}
    ${it.did.length ? `<div class="d-sec"><h4>Что сделал</h4>${list(it.did)}</div>` : ""}
    ${it.result.length ? `<div class="d-sec"><h4>Результат</h4>${list(it.result)}</div>` : ""}
    ${it.tools.length ? `<div class="d-sec"><h4>Инструменты</h4><div class="tags">${it.tools.map(t => `<span class="skill">${rich(t)}</span>`).join("")}</div></div>` : ""}
    ${it.link ? `<div class="d-sec"><a class="chip-link" ${linkAttr(it.link)}>${esc(it.link.label)}</a></div>` : ""}`;
  stopRing(); if (it.id === "tours") requestAnimationFrame(() => mountRing(it));
  const setNav = (btn, f, label) => { btn.disabled = !f; btn.innerHTML = f ? `<small>${label}</small>${esc(f.title)}` : ""; btn.onclick = f ? () => go(key(f)) : null; };
  setNav($("#dPrev"), prev, "Назад"); setNav($("#dNext"), next, "Дальше");
  $("#dBody").scrollTop = 0;
}
function go(k) { location.hash = "p/" + k; }
function openDrawer(it) {
  if (!drawer.classList.contains("open")) lastFocus = document.activeElement;
  renderItem(it);
  drawer.classList.add("open"); overlay.classList.add("open");
  drawer.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden";
  drawer.focus({ preventScroll: true });
}
function closeDrawer(updateHash = true) {
  stopRing();
  drawer.classList.remove("open"); overlay.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true"); document.body.style.overflow = "";
  if (updateHash && location.hash.startsWith("#p/")) {
    try { history.pushState(null, "", location.pathname + location.search); }
    catch { location.hash = "_"; }
  }
  lastFocus?.focus?.({ preventScroll: true });
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("p/")) { const it = flat.find(f => key(f) === h.slice(2)); if (it) return openDrawer(it); }
  if (drawer.classList.contains("open")) closeDrawer(false);
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { go(o.dataset.open); return; }
  const f = e.target.closest("[data-filter]"); if (f) { setFilter(f.dataset.filter); return; }
  const g = e.target.closest("[data-goto]"); if (g) { closeDrawer(); openFold(g.dataset.goto.startsWith("exp-") ? "experience" : g.dataset.goto); setTimeout(() => document.getElementById(g.dataset.goto)?.scrollIntoView(), 50); }
});
overlay.onclick = () => closeDrawer();
$("#dClose").onclick = () => closeDrawer();

/* ---- 3D-карусель туров комиков ---- */
let ringRaf = 0, ringOff = null;
function stopRing() { cancelAnimationFrame(ringRaf); ringRaf = 0; if (ringOff) { ringOff(); ringOff = null; } }
function mountRing(it) {
  const stage = document.getElementById("ringStage"); if (!stage) return;
  const PAL = ["#5d3081", "#d93e5e", "#0d0b0b", "#47a03f", "#ae664d", "#1d3bd1", "#e5463f", "#1e2e4a", "#ffd400", "#14674a", "#d74392", "#2a44d8"];
  const items = it.subs.map((x, i) => { const show = /^«/.test(x.title); return { name: x.title.replace(/[«»]/g, ""), sub: show ? "Шоу" : "Тур комика", c: PAL[i % PAL.length], lite: PAL[i % PAL.length] === "#ffd400", img: x.img || "" }; });
  const N = items.length, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad = n => String(n).padStart(2, "0"), lerp = (a, b, t) => a + (b - a) * t, cl = (v, a, b) => Math.min(b, Math.max(a, v));
  stage.innerHTML = items.map((p, i) => `<button type="button" class="rc${p.lite ? " lite" : ""}${p.img ? " has-img" : ""}" data-i="${i}" style="--c:${p.c}" aria-label="${esc(p.name)}">${p.img ? `<img class="rc-img" src="${esc(p.img)}" alt="" draggable="false" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : ""}<span class="rt"><span>${esc(p.sub)}</span><span>${pad(i + 1)}</span></span><p class="rn">${esc(p.name).replace(" ", "<br>")}</p></button>`).join("");
  const cards = [...stage.querySelectorAll(".rc")];
  let cw = 200, R = 600, step = .3, W = 400;
  const layout = () => { W = stage.clientWidth; const H = stage.clientHeight; cw = Math.min(W * .46, H * .62, 230); stage.style.setProperty("--rw", cw + "px"); R = Math.max(W * .9, cw * 3.2); step = (cw * 1.18) / R; stage.style.perspective = R + "px"; };
  layout(); const ro = new ResizeObserver(layout); ro.observe(stage);
  let cur = 0, target = 0, prev = 0, active = -1, dragging = false, sx = 0, sc = 0, moved = 0, lx = 0, lt = 0, fv = 0, downI = -1;
  const wrap = p => { p = ((p % N) + N) % N; return p >= N / 2 ? p - N : p; };
  const info = document.getElementById("ringInfo");
  function setActive(i) {
    active = i; info.classList.add("out");
    setTimeout(() => { document.getElementById("ringName").textContent = items[i].name; document.getElementById("ringSub").textContent = items[i].sub === "Шоу" ? "Шоу, продвижение" : "Продвижение тура"; info.classList.remove("out"); }, reduce ? 0 : 180);
    document.getElementById("ringCount").textContent = `${pad(i + 1)} / ${pad(N)}`;
  }
  function frame() {
    if (!dragging) cur += (target - cur) * (reduce ? 1 : .09);
    const vel = cur - prev; prev = cur;
    cards.forEach((el, i) => {
      const p = wrap(i - cur), ap = Math.abs(p), th = p * step;
      const x = R * Math.sin(th), z = R * (1 - Math.cos(th)) * 1.05, r = -th * 180 / Math.PI;
      const op = cl((3.4 - ap) / .6, 0, 1), blur = Math.max(0, ap - .55) * 1.6 + Math.min(Math.abs(vel) * 30, 3);
      el.style.opacity = op; el.style.visibility = op < .01 ? "hidden" : "visible"; el.style.zIndex = Math.round(100 - ap * 10);
      el.style.transform = `translate3d(${x}px,0,${z}px) rotateY(${r}deg)`;
      el.style.filter = (blur > .05 ? `blur(${blur.toFixed(2)}px) ` : "") + `brightness(${(1 - Math.min(ap * .07, .28)).toFixed(3)})`;
    });
    const i = ((Math.round(cur) % N) + N) % N; if (i !== active) setActive(i);
    ringRaf = requestAnimationFrame(frame);
  }
  const goTo = i => { const b = Math.round(target); target = b + wrap(i - b); };
  document.getElementById("ringPrev").onclick = () => target = Math.round(target) - 1;
  document.getElementById("ringNext").onclick = () => target = Math.round(target) + 1;
  let snapT = null;
  const onWheel = e => { const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0; if (!d) return; e.preventDefault(); target += d / (cw * 1.18) * .55; clearTimeout(snapT); snapT = setTimeout(() => target = Math.round(target), 140); };
  const onDown = e => { if (e.button > 0) return; dragging = true; moved = 0; sx = lx = e.clientX; lt = performance.now(); sc = cur; fv = 0; const c = e.target.closest(".rc"); downI = c ? +c.dataset.i : -1; stage.setPointerCapture(e.pointerId); };
  const onMove = e => { if (!dragging) return; const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx)); if (moved > 6) stage.classList.add("dragging"); cur = target = sc - dx / (cw * 1.18); const now = performance.now(), dt = Math.max(1, now - lt); fv = lerp(fv, (e.clientX - lx) / dt, .4); lx = e.clientX; lt = now; };
  const onUp = () => { if (!dragging) return; dragging = false; stage.classList.remove("dragging"); if (moved > 6) { target = Math.round(cur - fv * 220 / (cw * 1.18)); return; } if (downI >= 0) goTo(downI); };
  const onKey = e => { if (!drawer.classList.contains("open")) return; if (e.key === "ArrowRight") { e.preventDefault(); target = Math.round(target) + 1; } if (e.key === "ArrowLeft") { e.preventDefault(); target = Math.round(target) - 1; } };
  stage.addEventListener("wheel", onWheel, { passive: false }); stage.addEventListener("pointerdown", onDown); stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp); stage.addEventListener("pointercancel", onUp); document.addEventListener("keydown", onKey);
  ringOff = () => { ro.disconnect(); document.removeEventListener("keydown", onKey); };
  ringRaf = requestAnimationFrame(frame);
}

/* ---- свайп в панели проекта: влево — следующий кейс, вправо — предыдущий ---- */
(() => {
  const body = $("#dBody"), calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let sx = 0, sy = 0, dx = 0, drag = null;
  const reset = () => { body.style.transition = "transform .25s ease, opacity .25s ease"; body.style.transform = ""; body.style.opacity = ""; setTimeout(() => body.style.transition = "", 260); };
  body.addEventListener("touchstart", e => { if (e.touches.length !== 1 || e.target.closest(".ring")) { drag = false; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; drag = null; body.style.transition = ""; }, { passive: true });
  body.addEventListener("touchmove", e => {
    if (drag === false || e.touches.length !== 1) return;
    dx = e.touches[0].clientX - sx; const dy = e.touches[0].clientY - sy;
    if (drag === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) drag = Math.abs(dx) > Math.abs(dy) * 1.2;
    if (drag) { body.style.transform = `translateX(${dx * .55}px) rotate(${dx * .006}deg)`; body.style.opacity = String(1 - Math.min(.45, Math.abs(dx) / 700)); }
  }, { passive: true });
  body.addEventListener("touchend", () => {
    if (!drag) return; drag = null;
    if (Math.abs(dx) < 70) return reset();
    const dir = dx < 0 ? 1 : -1, cur = flat.find(f => key(f) === decodeURIComponent(location.hash.slice(3)));
    const i = flat.indexOf(cur), nx = flat[(i + dir + flat.length) % flat.length];
    if (!nx) return reset();
    const out = calm ? null : body.animate([{ transform: body.style.transform, opacity: body.style.opacity || 1 }, { transform: `translateX(${-dir * 60}%)`, opacity: 0 }], { duration: 160, easing: "ease-in" });
    const swap = () => {
      body.style.transform = ""; body.style.opacity = "";
      go(key(nx));
      if (!calm) requestAnimationFrame(() => body.animate([{ transform: `translateX(${dir * 45}%)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)" }));
    };
    out ? (out.onfinish = swap) : swap();
  });
})();

/* ---- случайный кейс по кубику ---- */
(() => {
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PIPS = { 1: [[12, 12]], 2: [[8, 8], [16, 16]], 3: [[8, 8], [12, 12], [16, 16]], 4: [[8, 8], [16, 8], [8, 16], [16, 16]], 5: [[8, 8], [16, 8], [12, 12], [8, 16], [16, 16]], 6: [[8, 8], [16, 8], [8, 12], [16, 12], [8, 16], [16, 16]] };
  const COLORS = ["#5d3081", "#d93e5e", "#e5322d", "#47a03f", "#ffd400", "#2a44d8", "#ae664d", "#1e2e4a", "#ff8c00"];
  const face = (btn, n) => { btn.querySelector(".pips").innerHTML = PIPS[n].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.6"/>`).join(""); };
  /* мешок без повторов: все кейсы по разу, потом новый круг */
  const pool = flat.filter(f => f.company.id !== "pet" && !isPh(f.short) && !MINOR.includes(f.id));
  /* первые броски — главные кейсы по порядку, дальше случайно */
  const FIRST = ["kcell", "rbk", "has", "pernod", "tele2"];
  let bag = FIRST.map(id => pool.find(f => f.id === id)).filter(Boolean), last = null;
  const firstRound = new Set(bag);
  const shuffleRest = () => pool.filter(f => !firstRound.has(f)).map(f => [Math.random(), f]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const next = () => {
    if (!bag.length) { bag = firstRound.size ? shuffleRest() : pool.map(f => [Math.random(), f]).sort((a, b) => a[0] - b[0]).map(x => x[1]); firstRound.clear(); if (bag[0] === last && bag.length > 1) bag.push(bag.shift()); }
    const cur = drawer.classList.contains("open") ? flat.find(f => key(f) === decodeURIComponent(location.hash.slice(3))) : null;
    let f = bag.shift(); if (f === cur && bag.length) { bag.push(f); f = bag.shift(); }
    return last = f;
  };
  function burst(btn) {
    const r = btn.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    for (let i = 0; i < 22; i++) {
      const d = document.createElement("span"); d.className = "confetti";
      d.style.left = x0 + "px"; d.style.top = y0 + "px"; d.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(d);
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 110;
      d.animate([{ transform: "translate(-50%,-50%) rotate(0)", opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * v}px), calc(-50% + ${Math.sin(a) * v + 40}px)) rotate(${Math.random() * 540}deg)`, opacity: 0 }], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => d.remove();
    }
  }
  let busy = false;
  function roll(btn) {
    if (busy) return; busy = true;
    const f = next(), done = () => {
      face(btn, 1 + Math.floor(Math.random() * 6));
      if (!calm) burst(btn);
      go(key(f));
      requestAnimationFrame(() => { const b = $("#dBody"); b.classList.remove("reroll"); void b.offsetWidth; b.classList.add("reroll"); });
      busy = false;
    };
    if (calm) return done();
    btn.classList.remove("rolling"); void btn.offsetWidth; btn.classList.add("rolling");
    let t = 0; const iv = setInterval(() => { face(btn, 1 + Math.floor(Math.random() * 6)); if ((t += 70) >= 630) { clearInterval(iv); done(); } }, 70);
  }
  ["#diceBtn", "#dDice"].forEach(id => { const b = $(id); face(b, 5); b.addEventListener("click", () => roll(b)); b.addEventListener("animationend", () => b.classList.remove("rolling")); });
})();

/* Esc закрывает панель проекта */
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer(); });
route();
</script>
